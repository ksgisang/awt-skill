id: "SC-001"
name: "Test Name"
description: "What this test verifies"
tags: ["tag1", "tag2"]
variables:
  url: "https://example.com"

steps:
  - step: 1
    action: navigate
    value: "{{url}}"
    description: "Navigate to the application"

  - step: 2
    action: find_and_click
    target:
      text: "Button Text"
    description: "Click the target button"
    # 3-tier hybrid matching (defaults shown — usually omit these):
    # method: auto        # auto | template | ocr | vision
    # learn: true         # save to pattern DB for faster future matching
    # fallback: true      # try next tier if current method fails

  - step: 3
    action: assert
    assert_type: text_visible
    expected:
      - type: text_visible
        value: "Expected text on screen"
    description: "Verify expected result"
    # text_visible and assert_text are SUBSTRING matches: the right words
    # wrapped in junk pass. When the point is *how* something renders, use
    # text_equals with a selector -- it is the only exact match AWT has:
    #
    #   assert_type: text_equals
    #   value: "질량"
    #   target:
    #     selector: "#question"

  - step: 4
    action: assert_url
    value: "/expected-path"
    description: "Verify the final URL"

# The scenario-level `expected_result:` field is checked after the last step
# and before teardown. Write typed entries -- a plain sentence is reported as a
# warning and the run exits 3, because a sentence describes an outcome and is
# not a value AWT can look for. (references/scenario-schema.md)
#
# expected_result:
#   - type: url_contains
#     value: "/expected-path"
